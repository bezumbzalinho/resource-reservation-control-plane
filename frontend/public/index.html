  <!-- AdminLTE App -->
  <script src="%PUBLIC_URL%/dist/js/adminlte.min.js" defer></script>
  <script>

    
    const body = document.body;

      const observer = new ResizeObserver((entries) => {
        const NavItems = document.getElementsByClassName("nav-item")
	const bodyElement = entries[0];
        const IsSmallEnough = bodyElement.contentRect.width <= 990;
         if(IsSmallEnough){
      
           for(let i = 2; i<NavItems.length; i++)
           {
             if(i!= 3 && i!=6 && i!=10){
               NavItems[i].setAttribute("data-widget","pushmenu")
             }
           }
         }
         else{
           for (let i = 2; i < NavItems.length; i++) {
             if (i != 3 && i != 6 && i != 10) {
               NavItems[i].removeAttribute("data-widget")
             }
           }
         }
      });
      observer.observe(body);
  </script>
  </body>
